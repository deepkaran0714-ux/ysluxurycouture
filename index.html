<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="YS Luxury Couture - Coming Soon. Premium luxury fashion opening soon.">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <title>YS Luxury Couture | Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at center, #0a0a0a 0%, #000000 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      color: #fff;
      overflow-x: hidden;
      position: relative;
    }

    /* Animated gradient overlay for extra motion */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.08) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
      z-index: 0;
      animation: breatheGlow 8s infinite alternate ease-in-out;
    }

    @keyframes breatheGlow {
      0% {
        opacity: 0.3;
        transform: scale(1);
      }
      100% {
        opacity: 0.8;
        transform: scale(1.2);
      }
    }

    /* Main container - perfectly centered with elegant floating motion */
    .container {
      text-align: center;
      max-width: 680px;
      width: 90%;
      margin: 0 auto;
      padding: 2rem 1.8rem;
      background: rgba(10, 10, 10, 0.55);
      backdrop-filter: blur(3px);
      border-radius: 42px;
      border: 1px solid rgba(212, 175, 55, 0.25);
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4), 0 0 20px rgba(212, 175, 55, 0.1);
      position: relative;
      z-index: 15;
      animation: floatContainer 6s infinite ease-in-out, fadeInScale 1.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      transition: all 0.4s ease;
    }

    @keyframes floatContainer {
      0% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-12px);
      }
      100% {
        transform: translateY(0px);
      }
    }

    @keyframes fadeInScale {
      0% {
        opacity: 0;
        transform: scale(0.95) translateY(30px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* Brand name with shimmering motion */
    h1 {
      font-size: 3.3rem;
      letter-spacing: 3px;
      font-weight: 800;
      background: linear-gradient(135deg, #FFFFFF 0%, #d4af37 45%, #F9E076 70%, #d4af37 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 12px;
      animation: shimmerText 6s linear infinite, textGlow 3s infinite alternate;
      text-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    @keyframes shimmerText {
      0% {
        background-position: 0% 50%;
      }
      100% {
        background-position: 200% 50%;
      }
    }

    @keyframes textGlow {
      0% {
        filter: drop-shadow(0 0 2px rgba(212, 175, 55, 0.3));
      }
      100% {
        filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.7));
      }
    }

    /* Animated gold line with pulse and expand */
    .line {
      width: 100px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #d4af37, #ffdf7e, #d4af37, transparent);
      margin: 18px auto 20px;
      animation: linePulse 2.5s infinite ease-in-out, expandWidth 2s infinite alternate;
      border-radius: 2px;
    }

    @keyframes linePulse {
      0% {
        opacity: 0.6;
        box-shadow: 0 0 2px #d4af37;
      }
      100% {
        opacity: 1;
        box-shadow: 0 0 12px #d4af37;
      }
    }

    @keyframes expandWidth {
      0% {
        width: 70px;
      }
      100% {
        width: 130px;
      }
    }

    h2 {
      font-size: 1.35rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 1px;
      margin-bottom: 20px;
      backdrop-filter: blur(2px);
      animation: fadeSlideUp 0.9s ease-out 0.2s both;
    }

    /* "Opening Soon" with energetic motion */
    .coming {
      font-size: 2.2rem;
      font-weight: 700;
      color: #d4af37;
      margin-bottom: 20px;
      animation: glowPulse 1.8s infinite alternate, softBounce 2s infinite;
      display: inline-block;
      letter-spacing: 2px;
    }

    @keyframes glowPulse {
      0% {
        text-shadow: 0 0 4px #d4af37;
        opacity: 0.9;
      }
      100% {
        text-shadow: 0 0 22px #e6c745, 0 0 8px #ffdf7e;
        opacity: 1;
      }
    }

    @keyframes softBounce {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-5px);
      }
    }

    /* Signup section with staggered motion */
    .signup-section {
      margin-top: 40px;
      padding-top: 25px;
      border-top: 1px solid rgba(212, 175, 55, 0.4);
      animation: fadeSlideUp 0.9s ease-out 0.35s both;
    }

    .signup-section h3 {
      font-size: 1rem;
      color: #d4af37;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 20px;
      text-transform: uppercase;
      position: relative;
      display: inline-block;
    }

    .signup-section h3::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 20%;
      width: 60%;
      height: 1px;
      background: #d4af37;
      animation: underlineSlip 2.2s infinite ease;
    }

    @keyframes underlineSlip {
      0% {
        width: 0%;
        left: 50%;
      }
      50% {
        width: 70%;
        left: 15%;
      }
      100% {
        width: 0%;
        left: 50%;
      }
    }

    /* Stylish form with motion */
    .email-form {
      display: flex;
      gap: 14px;
      max-width: 460px;
      margin: 10px auto 0;
      flex-wrap: wrap;
      justify-content: center;
    }

    .email-form input {
      flex: 1;
      min-width: 210px;
      padding: 14px 18px;
      background: rgba(20, 20, 20, 0.7);
      border: 1.5px solid #d4af37;
      border-radius: 50px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.6, 1.1);
      outline: none;
      backdrop-filter: blur(4px);
      font-family: 'Poppins', sans-serif;
    }

    .email-form input::placeholder {
      color: rgba(255, 255, 255, 0.6);
      font-weight: 400;
    }

    .email-form input:focus {
      transform: scale(1.02);
      background: rgba(212, 175, 55, 0.12);
      border-color: #ffdf7e;
      box-shadow: 0 0 18px rgba(212, 175, 55, 0.5);
    }

    .email-form button {
      padding: 14px 32px;
      background: linear-gradient(145deg, #d4af37, #b8922a);
      border: none;
      border-radius: 50px;
      font-weight: 800;
      color: #000;
      cursor: pointer;
      font-size: 0.9rem;
      font-family: 'Poppins', sans-serif;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      transition: all 0.25s ease;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }

    .email-form button:hover {
      transform: translateY(-4px) scale(1.02);
      background: linear-gradient(145deg, #e6c745, #d4af37);
      box-shadow: 0 12px 25px rgba(212, 175, 55, 0.4);
    }

    .email-form button:active {
      transform: translateY(2px);
    }

    /* Responsive adjustments & perfect centering */
    @media (max-width: 768px) {
      .container {
        width: 92%;
        padding: 1.8rem 1.2rem;
      }
      h1 {
        font-size: 2.2rem;
        letter-spacing: 1px;
      }
      .coming {
        font-size: 1.7rem;
      }
      h2 {
        font-size: 1rem;
      }
      .email-form {
        flex-direction: column;
        gap: 12px;
      }
      .email-form input,
      .email-form button {
        width: 100%;
        border-radius: 50px;
      }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.8rem;
      }
      .coming {
        font-size: 1.4rem;
      }
      .container {
        padding: 1.5rem 1rem;
      }
      .signup-section h3 {
        font-size: 0.85rem;
      }
    }

    /* Floating particles (dynamic motion background) */
    .particle-field {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.6), rgba(255, 223, 126, 0.2));
      border-radius: 50%;
      pointer-events: none;
      animation: floatParticle linear infinite;
      filter: blur(0.5px);
    }

    @keyframes floatParticle {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
      }
      15% {
        opacity: 0.7;
      }
      85% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(-15vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* subtle noise overlay texture for luxury motion depth */
    .noise-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iMzAwIj48ZmlsdGVyIGlkPSJmIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iLjciIG51bU9jdGF2ZXM9IjMiLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWx0ZXI9InVybCgjZikiIG9wYWNpdHk9IjAuMDYiLz48L3N2Zz4=');
      background-repeat: repeat;
      opacity: 0.2;
      pointer-events: none;
      z-index: 2;
    }
  </style>
</head>
<body>

  <!-- main content container perfectly centered -->
  <div class="container">
    <h1>YS Luxury Couture</h1>
    <div class="line"></div>
    <h2>Timeless Elegance | Modern Splendor</h2>
    <div class="coming">Opening Soon</div>

    <div class="signup-section">
      <h3>Join the Exclusive List</h3>
      <form class="email-form" id="notifyForm">
        <input 
          type="email" 
          placeholder="Your email address" 
          required 
          aria-label="Email for notification"
          id="emailInput"
        >
        <button type="submit">Notify Me</button>
      </form>
      <p style="font-size: 0.7rem; margin-top: 18px; opacity: 0.6; letter-spacing: 0.5px;">✦ Be first to experience luxury ✦</p>
    </div>
  </div>

  <!-- Dynamic motion particle field (floating gold dust) -->
  <div class="particle-field" id="particleField"></div>
  <div class="noise-overlay"></div>

  <script>
    (function() {
      // ---------- Dynamic particle system for extra motion (luxury floating dust) ----------
      const particleContainer = document.getElementById('particleField');
      const PARTICLE_COUNT = 80;
      
      function createParticles() {
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const particle = document.createElement('div');
          particle.classList.add('particle');
          
          // Random size between 2px and 8px
          const size = Math.random() * 6 + 2;
          particle.style.width = `${size}px`;
          particle.style.height = `${size}px`;
          
          // Random horizontal position
          particle.style.left = `${Math.random() * 100}%`;
          
          // Random animation duration (4s to 18s) for natural floating motion
          const duration = Math.random() * 14 + 5;
          particle.style.animationDuration = `${duration}s`;
          
          // Random delay to stagger motion
          const delay = Math.random() * 12;
          particle.style.animationDelay = `${delay}s`;
          
          // Random opacity for depth
          const opacity = Math.random() * 0.5 + 0.2;
          particle.style.opacity = opacity;
          
          // Some particles get a golden shimmer
          if (Math.random() > 0.7) {
            particle.style.background = 'radial-gradient(circle, #ffdf7e, #d4af37)';
            particle.style.boxShadow = '0 0 4px gold';
          }
          
          particleContainer.appendChild(particle);
        }
      }
      
      createParticles();
      
      // periodically refresh some particles for lively motion (optional smoothness)
      setInterval(() => {
        const particles = document.querySelectorAll('.particle');
        if (particles.length > PARTICLE_COUNT - 5) return;
        // if any particle missing, add few more
        const currentCount = particles.length;
        if (currentCount < PARTICLE_COUNT - 10) {
          for (let i = 0; i < 5; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            const size = Math.random() * 6 + 2;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${Math.random() * 100}%`;
            particle.style.animationDuration = `${Math.random() * 14 + 5}s`;
            particle.style.animationDelay = `${Math.random() * 12}s`;
            particle.style.opacity = Math.random() * 0.5 + 0.2;
            particleContainer.appendChild(particle);
          }
        }
      }, 8000);
      
      // ---------- Form handling with micro-motion feedback (success animation) ----------
      const form = document.getElementById('notifyForm');
      const emailInput = document.getElementById('emailInput');
      
      function showTemporaryFeedback(message, isError = false) {
        // Create floating feedback element with motion
        const feedbackDiv = document.createElement('div');
        feedbackDiv.textContent = message;
        feedbackDiv.style.position = 'fixed';
        feedbackDiv.style.bottom = '25px';
        feedbackDiv.style.left = '50%';
        feedbackDiv.style.transform = 'translateX(-50%) translateY(20px)';
        feedbackDiv.style.backgroundColor = isError ? 'rgba(180, 50, 50, 0.9)' : 'rgba(212, 175, 55, 0.95)';
        feedbackDiv.style.color = '#000';
        feedbackDiv.style.padding = '12px 28px';
        feedbackDiv.style.borderRadius = '50px';
        feedbackDiv.style.fontWeight = '600';
        feedbackDiv.style.fontSize = '0.9rem';
        feedbackDiv.style.backdropFilter = 'blur(8px)';
        feedbackDiv.style.zIndex = '999';
        feedbackDiv.style.fontFamily = "'Poppins', sans-serif";
        feedbackDiv.style.boxShadow = '0 8px 20px rgba(0,0,0,0.3)';
        feedbackDiv.style.border = '1px solid rgba(255,215,0,0.5)';
        feedbackDiv.style.letterSpacing = '0.5px';
        feedbackDiv.style.transition = 'all 0.2s ease';
        feedbackDiv.style.opacity = '0';
        document.body.appendChild(feedbackDiv);
        
        // Animate in
        setTimeout(() => {
          feedbackDiv.style.opacity = '1';
          feedbackDiv.style.transform = 'translateX(-50%) translateY(0px)';
        }, 10);
        
        // Remove after 3 sec with fade out motion
        setTimeout(() => {
          feedbackDiv.style.opacity = '0';
          feedbackDiv.style.transform = 'translateX(-50%) translateY(20px)';
          setTimeout(() => {
            if (feedbackDiv.parentNode) feedbackDiv.remove();
          }, 300);
        }, 2800);
      }
      
      function handleSubmit(e) {
        e.preventDefault();
        const email = emailInput.value.trim();
        if (!email) {
          showTemporaryFeedback('✨ Please enter an email address', true);
          return;
        }
        if (!email.includes('@') || !email.includes('.')) {
          showTemporaryFeedback('✧ Enter a valid email address', true);
          return;
        }
        
        // Simulate subscription success with motion confirmation
        console.log('Email subscribed (luxury notify):', email);
        showTemporaryFeedback('✓ You’re on the list! We’ll whisper first.', false);
        
        // Additional button micro-motion effect
        const btn = form.querySelector('button');
        btn.style.transform = 'scale(0.97)';
        setTimeout(() => {
          btn.style.transform = '';
        }, 150);
        
        // reset form
        form.reset();
        
        // Optional: you could store or send to backend endpoint here
        // For demo purposes just logs and alert replaced with elegant toast
      }
      
      form.addEventListener('submit', handleSubmit);
      
      // Add extra interactive motion effect on the container - mouse parallax spark (optional tiny)
      const container = document.querySelector('.container');
      container.addEventListener('mousemove', (e) => {
        const rect = container.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        const y = ((e.clientY - rect.top) / rect.height) * 2 - 1;
        // subtle motion tilt to the gold line and container shadow for immersive feel
        const lineElem = document.querySelector('.line');
        if (lineElem) {
          lineElem.style.transform = `translateX(${x * 3}px) translateY(${y * 2}px)`;
        }
        container.style.boxShadow = `${x * 6}px ${y * 6}px 25px rgba(0,0,0,0.4), 0 0 20px rgba(212, 175, 55, 0.2)`;
      });
      
      container.addEventListener('mouseleave', () => {
        const lineElem = document.querySelector('.line');
        if (lineElem) {
          lineElem.style.transform = 'translateX(0px) translateY(0px)';
        }
        container.style.boxShadow = '0 25px 45px rgba(0, 0, 0, 0.4), 0 0 20px rgba(212, 175, 55, 0.1)';
      });
      
      // additional motion: gentle 'breathing' background as the body gradient moves
      let glowDirection = 1;
      let glowIntensity = 0.1;
      setInterval(() => {
        const pseudo = document.querySelector('body');
        if (glowDirection === 1) {
          glowIntensity += 0.005;
          if (glowIntensity >= 0.22) glowDirection = -1;
        } else {
          glowIntensity -= 0.005;
          if (glowIntensity <= 0.05) glowDirection = 1;
        }
        // update radial glow overlay intensity dynamically (optional)
        const overlay = document.querySelector('body::before');
        // Not directly style-able but we do animate via existing keyframes
        // but adds extra smoothness
      }, 100);
    })();
  </script>
  
  <!-- Ensure all elements center properly on any screen resize (perfect centering) -->
  <style>
    /* Extra reinforcement for centering on all devices */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 0;
      position: relative;
    }
    .container {
      margin: 0 auto;
      position: relative;
      left: auto;
      right: auto;
      top: auto;
      transform: none; /* floating uses keyframes but doesn't affect centering */
    }
    /* for any overflow issue */
    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }
    /* stunning entrance for all elements inside container */
    .container h1, .container h2, .container .coming, .signup-section {
      animation: fadeSlideUpChild 0.7s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
      opacity: 0;
    }
    .container h1 {
      animation-delay: 0.05s;
    }
    .container .line {
      animation-delay: 0.15s;
      opacity: 0;
      animation: expandWidth 2s infinite alternate, linePulse 2.5s infinite ease-in-out, fadeInWidth 0.6s ease-out 0.2s forwards;
    }
    @keyframes fadeInWidth {
      from {
        opacity: 0;
        width: 0;
      }
      to {
        opacity: 1;
        width: 100px;
      }
    }
    .container h2 {
      animation-delay: 0.25s;
    }
    .container .coming {
      animation-delay: 0.35s;
    }
    .signup-section {
      animation-delay: 0.5s;
    }
    @keyframes fadeSlideUpChild {
      0% {
        opacity: 0;
        transform: translateY(18px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
    /* Enhanced hover motion for the form button, plus interactive ripple */
    .email-form button {
      transition: all 0.25s cubic-bezier(0.23, 1, 0.32, 1);
      overflow: hidden;
      position: relative;
    }
    .email-form button::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0px;
      height: 0px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.5s ease, height 0.5s ease;
    }
    .email-form button:active::after {
      width: 200px;
      height: 200px;
      opacity: 0;
      transition: 0s;
    }
    /* Additional decorative shine motion */
    .container::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(45deg, transparent, rgba(212,175,55,0.2), transparent, rgba(212,175,55,0.1));
      border-radius: 44px;
      z-index: -1;
      opacity: 0.5;
      animation: borderShine 5s infinite linear;
      pointer-events: none;
    }
    @keyframes borderShine {
      0% {
        opacity: 0.2;
        transform: translateX(-5%);
      }
      50% {
        opacity: 0.6;
        transform: translateX(5%);
      }
      100% {
        opacity: 0.2;
        transform: translateX(-5%);
      }
    }
  </style>
</body>
</html>
